apiVersion: v1
kind: Pod

metadata:
  name: my-pod

spec:
  containers:
  - name: nginx
    image: nginx:latest

    env:
    - name: APP_NAME
      valueFrom:
        configMapKeyRef:
          name: webapp-config
          key: APP_NAME

    - name: ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          name: webapp-config
          key: ENVIRONMENT

    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: my-secret
          key: username

    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: my-secret
          key: password